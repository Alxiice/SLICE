name: Local Ollama
version: 1.0.0

models:
  - name: Qwen2.5-Coder 14B
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: http://localhost:11434
    contextLength: 32768
    systemMessage: "You are an expert coding assistant. You work with Python, QML, JavaScript and C++. Be concise, prefer clear code over lengthy explanations. When editing code, only show the changed parts unless asked for the full file."
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    contextLength: 32768
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: Qwen2.5-Coder 7B Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - autocomplete

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed

mcpServers:
  - name: filesystem
    command: AIDE_REPO_DIR/.mcp/run-filesystem.sh

  - name: git
    command: AIDE_REPO_DIR/.mcp/run-git.sh
    args:
      - "${workspaceFolder}"

  - name: github
    command: AIDE_REPO_DIR/.mcp/run-github.sh

context:
  - provider: file
  - provider: codebase
  - provider: terminal
  - provider: problems
  - provider: diff
  - provider: folder

slashCommands:
  - name: edit
    description: Edit selected code
  - name: comment
    description: Add comments to code
  - name: tests
    description: Write unit tests
  - name: explain
    description: Explain this code
  - name: cmd
    description: Run a terminal command and use the output as context
