name: Local Ollama
version: 1.0.0
schema: v1

models:
  - name: Devstral Small 2
    provider: ollama
    model: devstral-small-2
    apiBase: http://localhost:11434
    contextLength: 16384      # keep this low to save VRAM for KV cache
    requestOptions:
      keepAlive: -1
    toolCallStrategy: function
    chatOptions:
      baseAgentSystemMessage: >
        You are an expert coding assistant for Python, QML, JavaScript and C++
        in a VFX studio (Meshroom/AliceVision). Be concise. When editing, show 
        only changed parts unless asked for the full file.
        ALWAYS invoke tools directly without any preamble or explanation before
        the tool call. Do NOT write text like "Let me find..." before calling
        a tool. Call the tool immediately and silently.
        ALWAYS use available tools rather than guessing.
        ALWAYS read file outlines before reading sections.
        NEVER read entire files at once — always use line ranges.
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5-Coder 14B
    provider: ollama
    model: qwen2.5-coder:14b
    apiBase: http://localhost:11434
    contextLength: 32768
    requestOptions:
      keepAlive: -1
    toolCallStrategy: function
    chatOptions:
      baseAgentSystemMessage: >
        You are an expert coding assistant for Python, QML, JavaScript and C++
        in a VFX studio (Meshroom/AliceVision). Be concise. When editing, show 
        only changed parts unless asked for the full file.
        ALWAYS invoke tools directly without any preamble or explanation before
        the tool call. Do NOT write text like "Let me find..." before calling
        a tool. Call the tool immediately and silently.
        ALWAYS use available tools rather than guessing.
        ALWAYS read file outlines before reading sections.
        NEVER read entire files at once — always use line ranges.
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    contextLength: 32768
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5-Coder 7B Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    capabilities:
      - tool_use
    roles:
      - autocomplete

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed

rules:
  - >
    When exploring an unfamiliar codebase, use outline to understand
    a file's structure before reading its full content. Only read full function
    implementations when you specifically need to understand or modify them.
    Never load entire files when you only need to understand structure.
    Prefer targeted reads over broad ones to conserve context.
  - >
    When exploring code, use these tools in order:
    1. filesystem list_directory to browse structure
    2. filesystem read_file with specific line ranges to read only what you need
    3. filesystem search_files to find symbols or patterns
    4. git tools for branch, history, and diff information
  - >
    When using git tools, always pass the full absolute repo path. 
  
  # 5. deepwiki for external library documentation
  # Never call tools that don't exist. Never output tool calls as plain text —
  # always invoke them directly. If a tool call fails, report the error instead
  # of stopping silently.

requestOptions:
  headers: {}

workspaceContext:
  indexDirectory: /datas/sonoleta/continue-index

mcpServers:
  - name: git
    command: /s/apps/users/sonoleta/github/CodingStack/.mcp/run-git.sh
    args:
      - "${workspaceFolder}"

  # - name: github
  #   command: /s/apps/users/sonoleta/github/CodingStack/.mcp/run-github.sh

  - name: filesystem
    command: /s/apps/users/sonoleta/github/CodingStack/.mcp/run-filesystem.sh
    args:
      - "${workspaceFolder}"
  
  # - name: deepwiki
  #   type: sse
  #   url: https://mcp.deepwiki.com/sse

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: terminal
  - provider: tree
  - provider: debugger
    params:
      stackDepth: 3
  - provider: repo-map
    params:
      includeSignatures: false  # true can increase context size by a lot
  - provider: os
  - provider: problems
  # Deprecated context providers
  - provider: codebase
  # - provider: folder
  # - provider: docs

slashCommands:
  - name: edit
    description: Edit selected code
  - name: comment
    description: Add comments to code
  - name: tests
    description: Write unit tests
  - name: explain
    description: Explain this code
  - name: cmd
    description: Run a terminal command and use the output as context
